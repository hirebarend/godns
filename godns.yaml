# godns.yaml — config for the godns nameserver.

server:
  addr: ":15353"

zones:
  - domain: godns.co.za
    primary_ns: ns1.godns.co.za
    hostmaster: hostmaster.godns.co.za
    serial: 2026052201
    ttl: 300
    nameservers:
      - ns1.godns.co.za
      - ns2.godns.co.za
    records:
      - name: "@"
        type: A
        value: 192.0.2.1
      - name: "@"
        type: AAAA
        value: "2001:db8::1"
      - name: "@"
        type: MX
        priority: 10
        value: mail.godns.co.za.
      - name: "@"
        type: TXT
        value: "v=spf1 -all"
      - name: www
        type: A
        value: 192.0.2.2
      - name: ns1
        type: A
        value: 192.0.2.10
      - name: ns2
        type: A
        value: 192.0.2.11
      - name: mail
        type: A
        value: 192.0.2.20

  - domain: barenderasmus.com
    primary_ns: ns1.godns.co.za
    hostmaster: hostmaster.barenderasmus.com
    serial: 2026052201
    ttl: 300
    nameservers:
      - ns1.godns.co.za
      - ns2.godns.co.za
    records:
      - name: "@"
        type: A
        value: 192.0.2.100
