# zones.yaml — community-contributed DNS records.
#
# How to add your domain:
#   1. At your registrar, change the nameservers for your domain to:
#        ns1.godns.co.za
#        ns2.godns.co.za
#   2. Add a new entry to the `zones:` list below with:
#        domain:   your full domain (e.g. example.com)
#        owner:    optional contact email
#        records:  list of records you want served
#   3. Open a pull request against this repository.
#
# SOA and NS records are managed by the server. Do not list them here.
# Allowed record types: A, AAAA, CNAME, MX, TXT.
# Names: "@" is the apex; bare labels like "www" are joined to your domain.

zones:
  - domain: barenderasmus.com
    owner: barend@wunderflats.com
    records:
      - name: "@"
        type: A
        value: 192.0.2.100
